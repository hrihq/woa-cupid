[boot_shim]
requires_kernel_header = true

[uefi_fd]
# Measured from cupid's own uefi_a.img ELF PT_LOAD (not a guess).
base = 0xA7100000
size = 0x300000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = true

[boot_image]
header_version = 4

[vendor_drivers]
# Blob-free: vendor DXE drivers must come from the owner's own device.
mode = "none"
